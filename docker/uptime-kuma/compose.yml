services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8@sha256:20abea8c48a163cf0a7a5d5936ab418e4b742d908704e1f58f6c06e56a9c6b67
    container_name: uptime-kuma
    restart: unless-stopped
    user: ${PUID}:${PGID}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
    extra_hosts:
      # *.fam is a CNAME to the tailnet name, which MagicDNS on this host does not follow;
      # resolve the Caddy monitor's domain to the host, where Caddy listens on 443.
      - "immich.fam.timonrieger.de:host-gateway"
