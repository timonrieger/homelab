# Event instance: a second, nearly empty Immich for guest uploads via shared links.
# Exposed through the Cloudflare Tunnel; Cloudflare Access keeps everything except
# the share routes off the internet.
# After each event, move the photos to the main instance with immich-go and delete them here.

name: immich-event

services:
  immich-server:
    container_name: immich_event_server
    image: ghcr.io/immich-app/immich-server:v3.0.3@sha256:c716dc20f957aafd89fa9d284a2ec63e25c9e2d8d8e87c6197d540a3dce237db
    user: ${PUID}:${PGID}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2284:2283'
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  # No face recognition or smart search on a staging box. Disabling the ML jobs in the
  # admin settings does not stop the service, so it stays commented out entirely.
  # immich-machine-learning:
  #   container_name: immich_event_machine_learning
  #   image: ghcr.io/immich-app/immich-machine-learning:v3.0.3@sha256:d76fe88b69282c09a97eac4f82dafa82cfd77bce274bc742591cde974f87dacb
  #   user: ${PUID}:${PGID}
  #   volumes:
  #     - ${MODEL_CACHE_LOCATION}:/cache
  #   env_file:
  #     - .env
  #   restart: unless-stopped
  #   healthcheck:
  #     disable: false

  redis:
    container_name: immich_event_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  database:
    container_name: immich_event_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
