services:
  immich-public-proxy:
    image: alangrainger/immich-public-proxy:4.0.0@sha256:54eb2a83f2d76a2e7e6b971638b011863ccb57a248e1d0a3e8a0f703c1f795dd
    container_name: immich-public-proxy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    ports:
      - "3002:3000"
    environment:
      PUBLIC_BASE_URL: https://immpub.timonrieger.de
      IMMICH_URL: http://beelink:2283
    healthcheck:
      test: curl -sf -m 4 http://localhost:3000/share/healthcheck -o /dev/null || exit 1
      start_period: 10s
      timeout: 5s
    volumes:
      - ./config.json:/app/config.json:ro

  immich-public-proxy-upload:
    image: alangrainger/immich-public-proxy-upload:4.1.2@sha256:0ef7e90c1fe2c94a40c690cdf8a1c9e0649eeff8cca4c1cd3d277bb18ccf765a
    container_name: immich-public-proxy-upload
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    ports:
      - "3003:3000"
    environment:
      PUBLIC_BASE_URL: https://immpub.timonrieger.de
      IMMICH_URL: http://beelink:2283
    healthcheck:
      test: curl -sf -m 4 http://localhost:3000/healthcheck -o /dev/null || exit 1
      start_period: 10s
      timeout: 5s
    volumes:
      - ./config.json:/app/config.json:ro
