services:
  server:
    image: gitea/gitea:28.1.0@sha256:52b4862a6baa25ba8f9769fb99355aaca4fa5cdf41031dad223686199eaecda4
    container_name: gitea
    restart: unless-stopped
    environment:
      # Exception to the non-root rule: the image's init needs root, but the
      # internal git user is mapped to the gitea system user (setup-permissions.yaml)
      - USER_UID=2002
      - USER_GID=2002
    networks:
      - gitea
    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"

networks:
  gitea:
    external: true
