name: immichframe
services:
  immichframe:
    container_name: immichframe
    image: ghcr.io/immichframe/immichframe:v1.0.39.0@sha256:b4bd2ac6ec75c0117a24bd627dc0b449d485ac87ec3a410c73d5db05a4bbfcaf
    restart: unless-stopped
    user: ${PUID}:${PGID}
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/Config
    environment:
      TZ: "Europe/Zurich"
