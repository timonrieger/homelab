[tools]
uv = "0.13.6"
ansible-base = { version = "2.21.5", uvx = true, uvx_args = "--python 3.14", postinstall = "ansible-galaxy collection install -U ansible.posix" }

[tasks.lint]
run = "uvx prek run --all-files"
description = "Run prek hooks"

[tasks.setup]
run = ["mise install", "uvx prek install -f"]
description = "Setup the project"

[tasks.docs]
dir = "docs"
run = ["pnpm install", "pnpm dev"]
description = "Start the development server for the documentation"

[tasks."ping"]
dir = "playbooks"
run = ["ansible beelink -m ping -i inventory.ini"]
description = "Ping the server"

[tasks."setup-server"]
dir = "playbooks"
run = ["ansible-playbook -i inventory.ini setup-server.yaml --ask-become-pass"]
description = "Setup the server"

[tasks."setup-backups"]
dir = "playbooks"
run = ["ansible-playbook -i inventory.ini setup-backups.yaml --ask-become-pass"]
description = "Setup the backups"

[tasks."setup-monitoring"]
dir = "playbooks"
run = ["ansible-playbook -i inventory.ini setup-monitoring.yaml --ask-become-pass"]
description = "Setup disk health checks and the external watchdog"

[tasks."setup-permissions"]
dir = "playbooks"
run = ["ansible-playbook -i inventory.ini setup-permissions.yaml --ask-become-pass"]
description = "Setup the permissions"

[tasks."sync-secrets"]
dir = "playbooks"
run = ["ansible-playbook -i inventory.ini sync-secrets.yaml --ask-become-pass"]
description = "Pull gitignored secrets from the server"

[tasks."update-system"]
dir = "playbooks"
run = ["ansible-playbook -i inventory.ini update-system.yaml --ask-become-pass"]
description = "Update system"

[tasks."cleanup-docker"]
dir = "playbooks"
run = ["ansible-playbook -i inventory.ini cleanup-docker.yaml --ask-become-pass"]
description = "Clean up Docker system (docker system prune -a -f)"
