- name: Provision beelink
  hosts: beelink
  become: true
  vars:
    user: timon
    cloudflared_tunnel_id: b6cad4cb-bfc4-4cb0-b0e6-2073891d169b
  tasks:
    - name: Ensure base apt packages are present
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - neovim
          - samba
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Import Tailscale GPG key
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'

    - name: Add Tailscale repository
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/debian/trixie.tailscale-keyring.list
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: '0644'
      register: tailscale_repo

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: "{{ tailscale_repo is changed }}"

    - name: Import Fish Shell GPG key
      ansible.builtin.shell: |
        curl -fsSL https://download.opensuse.org/repositories/shells:fish:release:4/Debian_13/Release.key | gpg --dearmor -o /etc/apt/trusted.gpg.d/shells_fish_release_4.gpg
      args:
        creates: /etc/apt/trusted.gpg.d/shells_fish_release_4.gpg

    - name: Add Fish Shell repository
      ansible.builtin.deb822_repository:
        name: shells-fish-release-4
        types: deb
        uris: http://download.opensuse.org/repositories/shells:/fish:/release:/4/Debian_13/
        suites: "/"
        signed_by: /etc/apt/trusted.gpg.d/shells_fish_release_4.gpg
        state: present
      register: fish_repo

    - name: Install Fish Shell
      ansible.builtin.apt:
        name: fish
        state: present
        update_cache: "{{ fish_repo is changed }}"

    - name: Set default shell to fish
      ansible.builtin.user:
        name: "{{ user }}"
        shell: /usr/bin/fish

    - name: Import Cloudflare GPG key (cloudflared)
      ansible.builtin.get_url:
        url: https://pkg.cloudflare.com/cloudflare-main.gpg
        dest: /usr/share/keyrings/cloudflare-main.gpg
        mode: "0644"

    - name: Add Cloudflared apt repository
      ansible.builtin.deb822_repository:
        name: cloudflared
        types: deb
        uris: https://pkg.cloudflare.com/cloudflared
        suites: any
        components: main
        signed_by: /usr/share/keyrings/cloudflare-main.gpg
        state: present
      register: cloudflared_repo

    - name: Install cloudflared
      ansible.builtin.apt:
        name: cloudflared
        state: present
        update_cache: "{{ cloudflared_repo is changed }}"

    - name: Ensure /etc/cloudflared exists
      ansible.builtin.file:
        path: /etc/cloudflared
        state: directory
        mode: "0755"

    - name: Copy cloudflared config.yml to /etc/cloudflared (authoritative)
      ansible.builtin.copy:
        src: files/cloudflare.config.yml
        dest: /etc/cloudflared/config.yml
        owner: root
        group: root
        mode: "0644"
        force: true
      notify: Reload systemd and restart cloudflared

    - name: Copy cloudflared tunnel credentials to /etc/cloudflared
      ansible.builtin.copy:
        src: files/cloudflare.credentials.json
        dest: "/etc/cloudflared/{{ cloudflared_tunnel_id }}.json"
        owner: root
        group: root
        mode: "0600"
      notify: Reload systemd and restart cloudflared

    - name: Install cloudflared systemd service (cloudflared service install)
      ansible.builtin.command: cloudflared service install
      args:
        creates: /etc/systemd/system/cloudflared.service
      notify: Reload systemd and restart cloudflared

    - name: Ensure cloudflared service is enabled and started
      ansible.builtin.systemd:
        name: cloudflared
        state: started
        enabled: true

    - name: Check if Docker is already installed
      ansible.builtin.command: which docker
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Download Docker convenience script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: '0755'
      when: docker_check.rc != 0

    - name: Run Docker convenience script
      ansible.builtin.command: /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: Start and enable Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ user }}"
        groups: docker
        append: true

    - name: Clean up Docker script
      ansible.builtin.file:
        path: /tmp/get-docker.sh
        state: absent

    - name: Ensure fish config directory exists
      ansible.builtin.file:
        path: /home/{{ user }}/.config/fish
        state: directory
        mode: "0755"
        owner: "{{ user }}"
        group: "{{ user }}"

    - name: Copy fish config file
      ansible.builtin.copy:
        src: files/config.fish
        dest: /home/{{ user }}/.config/fish/config.fish
        mode: "0644"
        owner: "{{ user }}"
        group: "{{ user }}"
        force: true

    # timon deploys the repo's docker/ tree here (see synchronize task below).
    # All other /srv ownership is managed exclusively by setup-permissions.yaml.
    - name: Ensure /srv/docker directory exists
      ansible.builtin.file:
        path: /srv/docker
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0750"

    - name: Copy fstab to /etc/fstab
      ansible.builtin.copy:
        src: files/fstab
        dest: /etc/fstab
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: fstab_copy_result

    - name: Apply fstab mounts
      ansible.builtin.command: mount -a
      when: fstab_copy_result is changed

    # Runs as timon: the config layer (/srv/docker/<app>) is timon-owned, while
    # app DATA dirs belong to the app users and are excluded — ownership there
    # is managed exclusively by setup-permissions.yaml (never chown recursively).
    - name: Synchronize Docker configurations to /srv/docker
      ansible.posix.synchronize:
        src: ../docker/
        dest: /srv/docker/
        delete: no
        recursive: yes
        rsync_opts:
          - "--exclude=*.example"
          - "--exclude=jellyfin/cache/"
          - "--exclude=jellyfin/config/"
      become: false

  handlers:
    - name: Reload systemd and restart cloudflared
      ansible.builtin.systemd:
        name: cloudflared
        state: restarted
        enabled: true
        daemon_reload: true
