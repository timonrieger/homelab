---
- name: Sync gitignored secrets from the server to the local repo
  hosts: beelink
  become: true
  vars:
    repo_root: "{{ playbook_dir }}/.."
    docker_root: /srv/docker

  tasks:
    - name: Find .env and Caddyfile files under {{ docker_root }}
      ansible.builtin.find:
        paths: "{{ docker_root }}"
        patterns: [".env", "Caddyfile"]
        hidden: true
        recurse: true
      register: docker_secrets

    - name: Fetch docker .env and Caddyfile files
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ repo_root }}/docker/{{ item.path | relpath(docker_root) }}"
        flat: true
      loop: "{{ docker_secrets.files }}"
      loop_control:
        label: "{{ item.path | relpath(docker_root) }}"

    - name: Fetch playbook files
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ playbook_dir }}/files/{{ item | basename }}"
        flat: true
      loop:
        - /home/restic/backup.sh
        - /home/restic/.config/rclone/rclone.conf
        - /root/mirror.sh
        - /root/db-dumps.sh
        - /root/disk-health.sh
        - /root/watchdog.sh

    - name: Find cloudflared tunnel credentials
      ansible.builtin.find:
        paths: /etc/cloudflared
        patterns: "*.json"
      register: cloudflared_credentials
      failed_when: cloudflared_credentials.matched != 1

    - name: Fetch cloudflared tunnel credentials
      ansible.builtin.fetch:
        src: "{{ cloudflared_credentials.files[0].path }}"
        dest: "{{ playbook_dir }}/files/cloudflare.credentials.json"
        flat: true
